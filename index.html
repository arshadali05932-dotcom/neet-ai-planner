<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111c32">
  <title>NEET AI Planner — Loading</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111c32;color:#eef4ff;font:16px system-ui}main{padding:24px;text-align:center}</style>
</head>
<body>
  <main>Loading NEET AI Planner…</main>
  <script>
  (async()=>{
    try{
      const response=await fetch('./app-bundle.html.gz.b64');
      if(!response.ok)throw new Error('App bundle could not be downloaded.');
      const binary=atob((await response.text()).trim());
      const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
      if(!('DecompressionStream' in window))throw new Error('Please update Chrome to a current version.');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const appHtml=await new Response(stream).text();
      document.open();document.write(appHtml);document.close();
    }catch(error){
      document.querySelector('main').textContent='Planner could not load. Please check your internet connection and refresh the page.';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
